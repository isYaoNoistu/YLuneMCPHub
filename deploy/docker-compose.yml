# 作用：用 Docker Compose 拉起月弦（Postgres + Hub，可选 Nginx 反代）
# 运行主机：部署机（已安装 Docker 与 Compose 插件）
# 调用方：人工，按本目录 README.md 操作
# 大概流程：
# 1) 复制 .env.example 为 .env，改口令与端口（不要提交 .env）
# 2) 构建上下文是仓库根目录（本文件 context: ..，用根目录 Dockerfile；apt/npm/pypi 默认国内镜像）
# 3) docker compose up -d --build
# 4) 浏览器打开 YLUNE_PORT，管理员登录后立刻改密码
# 5) 需要 HTTP 反代时再加 --profile proxy；需要 HTTPS 时填域名和证书后加 --profile https
# 6) 容器固定挂 /opt/mcp（宿主机 MCP_MOUNT_DIR）。空目录即可；二进制由 DevOpsMCP/deploy 写入
# 勿放密钥：口令、Token、内网地址、证书私钥只写本目录 .env 或宿主机路径，不要提交

name: ylune

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: ylune-postgres
    environment:
      POSTGRES_DB: ylune
      POSTGRES_USER: ylune
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - ylune-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ylune -d ylune"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ylune
    # 默认不把 5432 暴露到宿主机。排障需要时在 .env 设 PUBLISH_DB_PORT=5432 并取消下面注释。
    # ports:
    #   - "${PUBLISH_DB_PORT}:5432"

  ylune:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        NODE_DIST_MIRROR: ${NODE_DIST_MIRROR:-https://npmmirror.com/mirrors/node}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PYPI_INDEX: ${PYPI_INDEX:-https://mirrors.aliyun.com/pypi/simple}
    image: ylune:local
    container_name: ylune
    ports:
      - "${YLUNE_BIND:-0.0.0.0}:${YLUNE_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:-}
      DB_URL: postgresql://ylune:${DB_PASSWORD}@postgres:5432/ylune
      USE_DB: "true"
      BASE_PATH: ${BASE_PATH:-}
      YLUNE_DOMAIN: ${YLUNE_DOMAIN:-}
      INSTALL_BASE_URL: ${INSTALL_BASE_URL:-}
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 挂载点：DevOpsMCP 把 Linux 二进制 / targets / pgpass 写到宿主机目录，月弦 STDIO 读 /opt/mcp
      - ${MCP_MOUNT_DIR:-/data/ylune-mcp}:/opt/mcp:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - ylune

  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: ylune-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ylune:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ylune

  nginx-https:
    profiles: ["https"]
    image: nginx:1.27-alpine
    container_name: ylune-nginx-https
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      YLUNE_DOMAIN: ${YLUNE_DOMAIN:-}
    volumes:
      - ./nginx.https.conf.template:/etc/nginx/templates-src/default.conf:ro
      - ${TLS_CERT_FILE:-/data/certs/ylune/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_KEY_FILE:-/data/certs/ylune/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
    command:
      - /bin/sh
      - -c
      - envsubst '$$YLUNE_DOMAIN' < /etc/nginx/templates-src/default.conf > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    depends_on:
      ylune:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ylune

volumes:
  ylune-pg:

networks:
  ylune:
    driver: bridge
