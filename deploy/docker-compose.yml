# 作用：用 Docker Compose 拉起月弦（Postgres + Hub，可选 Nginx 反代）
# 运行主机：部署机（已安装 Docker 与 Compose 插件）
# 调用方：人工，按本目录 README.md 操作
# 大概流程：
# 1) 复制 .env.example 为 .env，改口令与端口（不要提交 .env）
# 2) 构建上下文是仓库根目录（本文件 context: ..，用根目录 Dockerfile）
# 3) docker compose up -d --build
# 4) 浏览器打开 YLUNE_PORT，管理员登录后立刻改密码
# 5) 需要反代时再加 --profile proxy
# 勿放密钥：口令、Token、内网地址只写本目录 .env 或宿主机环境变量

name: ylune

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ylune-postgres
    environment:
      POSTGRES_DB: ylune
      POSTGRES_USER: ylune
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - ylune-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ylune -d ylune"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ylune
    # 默认不把 5432 暴露到宿主机。排障需要时在 .env 设 PUBLISH_DB_PORT=5432 并取消下面注释。
    # ports:
    #   - "${PUBLISH_DB_PORT}:5432"

  ylune:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ylune:local
    container_name: ylune
    ports:
      - "${YLUNE_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deploy/.env}
      DB_URL: postgresql://ylune:${DB_PASSWORD}@postgres:5432/ylune
      USE_DB: "true"
      BASE_PATH: ${BASE_PATH:-}
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    # 容器是 Linux。要把 DevOpsMCP 的 Linux 二进制给 STDIO 用时，取消下面 volumes。
    # volumes:
    #   - ${DEVOPSMCP_BIN_DIR}:/opt/devopsmcp:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - ylune

  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: ylune-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ylune:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ylune

volumes:
  ylune-pg:

networks:
  ylune:
    driver: bridge
